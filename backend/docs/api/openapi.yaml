        1. Summarizes timeline and organizes discussion questions grounded in
        verified farm record IDs.

        2. Refuses unsafe requests without calling LLM.

        3. Automatically falls back to deterministic rule-based summary if LLM
        fails or times out.

        4. AI NEVER writes to or alters database records.

        Rate limit: 10 requests per minute. Allowed roles: `farmer`, `officer`
        (with valid share).
      security:
        - cookieAuth: []
        - csrfProtection: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - plotId
