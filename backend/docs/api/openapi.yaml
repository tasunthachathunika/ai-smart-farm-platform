  /api/ai/summary:
    post:
      tags:
        - AI
      summary: Generate AI records summary and suggested questions for extension officer
      description: >-
        IMPORTANT RESPONSIBLE AI NOTICE:

        Output is informational only, never a pesticide/fertilizer prescription,
        dosage or diagnosis.

        Safety filter guarantees:

        1. Requests for chemical dosages, brand product recommendations, or
        disease diagnosis are refused before calling the LLM.

        2. Record notes are sanitized to protect against prompt injection.

        3. Claims are grounded in supplied source-record IDs; hallucinated
        source IDs are dropped.

        4. If LLM times out, returns invalid JSON, or triggers a safety refusal,
        a deterministic non-AI fallback is returned.

        5. AI NEVER writes to or alters database records.

        Rate limit: 10 requests per minute. Allowed roles: `farmer`, `officer`
        (with valid share).
      security:
        - cookieAuth: []
        - csrfProtection: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - plotId
              properties:
                plotId:
                  type: string
                  format: uuid
                  example: b2c3d4e5-f6a7-48b9-0c1d-2e3f4a5b6c7d
                cycleId:
                  type: string
                  format: uuid
                  example: c3d4e5f6-a7b8-49c0-1d2e-3f4a5b6c7d8e
                userPrompt:
                  type: string
                  maxLength: 1000
                  example: Please summarize recent crop activities and suggest questions for my
                    upcoming meeting with the agricultural officer.
      responses:
        "200":
          description: AI summary output grounded in source records
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - isFallback
                  - flags
                properties:
                  data:
                    $ref: "#/components/schemas/AISummaryOutput"
                  isFallback:
                    type: boolean
                    example: false
                  flags:
                    type: array
                    items:
                      type: string
                    example: []
        "400":
          description: Safety violation - Request asked for chemical dosage, brand
            recommendation, or medical/disease diagnosis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: SAFETY_POLICY_VIOLATION
                  message: Requests for chemical dosages, pesticide recommendations, or disease
                    diagnoses cannot be processed by AI. Please consult your
                    local Agricultural Extension Officer.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/ai/visit-prep:
    post:
      tags:
