services:
  db:
    image: postgres:16-alpine
    container_name: goviya_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goviya_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goviya_password}
      POSTGRES_DB: ${POSTGRES_DB:-goviya_plus_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goviya_user} -d ${POSTGRES_DB:-goviya_plus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goviya_backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
